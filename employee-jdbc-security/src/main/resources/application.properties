spring.application.name=employee-jdbc-security
springdoc.swagger-ui.path=/docs

# H2 database configuration
spring.datasource.url=jdbc:h2:file:./data/employeedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# schema.sql her baslangicta calisir, tablolari kendisi olusturur (H2 console'a gerek yok)
spring.sql.init.mode=always

# H2 console configuration (sadece incelemek icin, veri yazmak icin sart degil)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
